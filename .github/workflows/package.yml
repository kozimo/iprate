name: Package

on:
  pull_request:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.2'
          enable-cache: false
      - name: Build archive and wheel
        run: uv build --no-sources --python 3.13
      - name: Check metadata and prepare release asset
        id: package
        run: |
          uv run --no-project --python 3.13 python -I - <<'PY'
          import os
          import re
          import shutil
          import tarfile
          from configparser import ConfigParser
          from email.parser import BytesParser
          from pathlib import Path
          from zipfile import ZipFile

          [wheel] = Path('dist').glob('*.whl')
          with ZipFile(wheel) as package:
              [metadata_path] = [name for name in package.namelist()
                                 if name.endswith('.dist-info/METADATA')]
              metadata = BytesParser().parsebytes(package.read(metadata_path))
              entry_points = ConfigParser()
              entry_points_path = Path(metadata_path).with_name('entry_points.txt')
              entry_points.read_string(package.read(entry_points_path.as_posix()).decode())
          assert metadata['Name'] == 'iprate', metadata['Name']
          assert metadata['Requires-Python'] == '>=3.8', metadata['Requires-Python']
          dependencies = metadata.get_all('Requires-Dist')
          assert dependencies == ['windows-curses; platform_system == "Windows"'], dependencies
          assert entry_points['console_scripts']['iprate'] == 'iprate.cli:run'

          version = metadata['Version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              tag = os.environ['GITHUB_REF_NAME']
              assert re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag), tag
              assert tag == f'v{version}', f'{tag} does not match package version {version}'
          archive = Path('dist') / f'iprate-{version}.tar.gz'
          with tarfile.open(archive) as source:
              expected = ['pyproject.toml', 'README.md']
              expected.extend(path.as_posix() for path in Path('src').rglob('*.py'))
              for name in expected:
                  assert source.getmember(f'iprate-{version}/{name}').isfile(), name
          shutil.copyfile(archive, Path('dist') / 'iprate.tar.gz')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print(f'version={version}', file=output)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iprate-release
          path: dist/iprate.tar.gz
          if-no-files-found: error

  install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, python: '3.8'}
          - {os: ubuntu-24.04, python: '3.13'}
          - {os: windows-2025, python: '3.13'}
          - {os: macos-15, python: '3.13'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iprate-release
          path: ${{ runner.temp }}
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: '0.12.2'
          enable-cache: false
      - name: Install and check the command
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          UV_TOOL_DIR: ${{ runner.temp }}/uv-tools
          UV_TOOL_BIN_DIR: ${{ runner.temp }}/uv-bin
          UV_CACHE_DIR: ${{ runner.temp }}/uv-cache
          IPRATE_TEST_PYTHON: ${{ matrix.python }}
          IPRATE_PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          uv tool install --python "$IPRATE_TEST_PYTHON" ./iprate.tar.gz
          uv run --no-project --python "$IPRATE_TEST_PYTHON" python -I - <<'PY'
          import os
          import subprocess
          from pathlib import Path
          from tempfile import TemporaryDirectory

          windows = os.name == 'nt'
          command = Path(os.environ['UV_TOOL_BIN_DIR'], 'iprate.exe' if windows else 'iprate')
          subprocess.run([command, '--help'], check=True)
          output = subprocess.check_output([command, '--version'], text=True).strip()
          assert output == f"iprate {os.environ['IPRATE_PACKAGE_VERSION']}", output

          tool_env = Path(os.environ['UV_TOOL_DIR'], 'iprate')
          python = tool_env / ('Scripts/python.exe' if windows else 'bin/python')
          smoke_test = (
              'import sys\n'
              'import curses, iprate.cli, iprate.tui.screen\n'
              'from iprate.api import _read\n'
              'assert _read(sys.argv[1], 64) == b"192.0.2.1"\n'
          )
          if windows:
              smoke_test += 'from importlib.metadata import version\nprint(version("windows-curses"))\n'
          with TemporaryDirectory() as directory:
              response = Path(directory, 'ipify.txt').resolve()
              response.write_bytes(b'192.0.2.1')
              subprocess.run([python, '-I', '-c', smoke_test, response.as_uri()], check=True)
          PY

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: install
    runs-on: ubuntu-24.04
    concurrency:
      group: iprate-release
      queue: max
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: iprate-release
          path: release
      - name: Publish the verified archive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -I - <<'PY'
          import os
          import re
          import subprocess

          def version(tag):
              parts = re.fullmatch(r'v([0-9]+)\.([0-9]+)\.([0-9]+)', tag)
              return tuple(map(int, parts.groups())) if parts else None

          repo = os.environ['GITHUB_REPOSITORY']
          tag = os.environ['GITHUB_REF_NAME']
          current = version(tag)
          assert current is not None, tag
          published = subprocess.check_output([
              'gh', 'api', f'repos/{repo}/releases', '--paginate', '--jq',
              '.[] | select(.draft == false and .prerelease == false) | .tag_name',
          ], text=True)
          stable = (number for number in map(version, published.splitlines()) if number is not None)
          latest = current > max(stable, default=(-1, -1, -1))
          subprocess.run([
              'gh', 'release', 'create', tag, 'release/iprate.tar.gz',
              '--repo', repo, '--verify-tag', '--title', f'iprate {tag}',
              '--generate-notes', '--latest' if latest else '--latest=false',
          ], check=True)
          PY
